app = 'text-to-attention'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # 512 MB is too small for ffmpeg burning subtitles into a 1080p/4K phone
  # clip while the video is also held in memory. 2 GB covers a 4K clip.
  memory_mb = 2048

# Keeps opt-outs (STOP) and WhatsApp last-message times across deploys.
# Create the volume first, then uncomment (see README "Keep opt-outs"):
#   fly volumes create tta_data --region iad --size 1 -a text-to-attention
# [mounts]
#   source = 'tta_data'
#   destination = '/data'
