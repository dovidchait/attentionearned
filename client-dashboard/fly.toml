# Fly.io config for the client dashboard (app text-to-attention-dashboard).
# Deployed by .github/workflows/dashboard-deploy.yml on merge to main
# (or Actions > "Deploy client dashboard to Fly" > Run workflow).
# Secrets (Fly dashboard > text-to-attention-dashboard > Secrets): ZERNIO_API_KEY,
# EMAILIT_API_KEY, optional EMAIL_FROM. DASHBOARD_JWT_SECRET is generated by the workflow.

app = "text-to-attention-dashboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  # The workflow copies fly-service/users.json here before each deploy.
  USERS_FILE = "/app/users.json"
  # Public URL used in magic-link emails and account-connect callbacks.
  # Change to https://dashboard.attentionearned.com once that domain points here.
  DASHBOARD_URL = "https://text-to-attention-dashboard.fly.dev"

[[http_service]]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
