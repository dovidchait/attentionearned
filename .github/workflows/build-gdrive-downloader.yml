name: Build GDrive Downloader

# Builds tools/gdrive-downloader into a Windows exe and commits it to
# public/downloads/ so the site serves it at /downloads/GDriveDownloader.exe.
on:
  push:
    paths:
      - 'tools/gdrive-downloader/gdrive_downloader.py'
      - '.github/workflows/build-gdrive-downloader.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gdrive-downloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exe
        working-directory: tools/gdrive-downloader
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --onefile --windowed --name GDriveDownloader --clean --noconfirm gdrive_downloader.py

      - uses: actions/upload-artifact@v4
        with:
          name: GDriveDownloader
          path: tools/gdrive-downloader/dist/GDriveDownloader.exe

      - name: Commit exe to public/downloads
        shell: bash
        run: |
          mkdir -p public/downloads
          cp tools/gdrive-downloader/dist/GDriveDownloader.exe public/downloads/
          cp tools/gdrive-downloader/gdrive_downloader.py public/downloads/
          (cd public/downloads && sha256sum GDriveDownloader.exe > GDriveDownloader.exe.sha256)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/downloads
          git diff --cached --quiet && exit 0
          git commit -m "Build GDriveDownloader.exe"
          git push
